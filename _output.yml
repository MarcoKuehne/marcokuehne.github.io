bookdown::gitbook:
  split_by: section     # one page per section; chapters and sections now sit
  toc_depth: 2          # at the same depth in both the Data and Analysis parts
  config:
    toc:
      collapse: subsection
      before: |
        <li><a href="./">Empirical Research</a></li>
      after: |
        <li><a href="http://marco-kuehne.com/" target="blank">Visit my personal page</a></li>
    download:
    - pdf
    - epub
  includes:
    after_body: www/webex.js
  md_extensions: -smart
