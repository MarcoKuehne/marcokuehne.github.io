book_filename: "Becoming-Fluent-In-Data"
new_session: no
delete_merged_file: yes
output_dir: docs

# File naming: Lnn-mm-name.Rmd
#   nn = chapter number   mm = 00 for the chapter wrapper, 01+ for its sections
# So every chapter's files sort together, wrapper first, in any file browser.

rmd_files:
  - index.Rmd

  # Introduction
  - L00-00-software.Rmd

  # Data
  - L01-00-foundations.Rmd
  - L02-00-structured-data.Rmd
  - L03-00-unstructured-data.Rmd
  - L04-00-imperfect-data.Rmd

  # Analysis
  - L05-00-compare.Rmd
  - L06-00-model.Rmd
  - L07-00-structure.Rmd
  - L08-00-reveal.Rmd
  - L09-00-identify.Rmd
  - L10-00-extract.Rmd

  # Back matter
  # Resources first, References last: the bibliography is anchored by the
  # <div id="refs"></div> in L99, so it renders on references.html.
  - L98-resources.Rmd
  - L99-references.Rmd

language:
  ui:
    chapter_name: "Chapter "

before_chapter_script: scripts/webex.R
